apiVersion: apps/v1
kind: Deployment
metadata: { name: analytics-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: analytics-service } }
  template:
    metadata: { labels: { app: analytics-service } }
    spec:
      containers:
        - name: analytics-service
          image: 325898365409.dkr.ecr.us-east-1.amazonaws.com/analytics-service:initial
          ports: [{ containerPort: 8005 }]
          env:
            - { name: PORT, value: "8005" }
            - { name: AWS_REGION, valueFrom: { configMapKeyRef: { name: toggle-master-config, key: AWS_REGION } } }
            - { name: AWS_SQS_URL, valueFrom: { secretKeyRef: { name: toggle-master-secrets, key: AWS_SQS_URL } } }
            - { name: AWS_DYNAMODB_TABLE, valueFrom: { configMapKeyRef: { name: toggle-master-config, key: AWS_DYNAMODB_TABLE } } }
          readinessProbe: { httpGet: { path: /health, port: 8005 } }
---
apiVersion: v1
kind: Service
metadata: { name: analytics-service }
spec:
  selector: { app: analytics-service }
  ports: [{ port: 8005, targetPort: 8005 }]
