apiVersion: apps/v1
kind: Deployment
metadata: { name: flag-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: flag-service } }
  template:
    metadata: { labels: { app: flag-service } }
    spec:
      containers:
        - name: flag-service
          image: 325898365409.dkr.ecr.us-east-1.amazonaws.com/flag-service:initial
          ports: [{ containerPort: 8002 }]
          env:
            - { name: PORT, value: "8002" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: toggle-master-secrets, key: FLAGS_DB_URL } } }
            - { name: AUTH_SERVICE_URL, valueFrom: { configMapKeyRef: { name: toggle-master-config, key: AUTH_SERVICE_URL } } }
          readinessProbe: { httpGet: { path: /health, port: 8002 } }
---
apiVersion: v1
kind: Service
metadata: { name: flag-service }
spec:
  selector: { app: flag-service }
  ports: [{ port: 8002, targetPort: 8002 }]
