apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/auth-service:initial
          ports: [{ containerPort: 8001 }]
          env:
            - { name: PORT, value: "8001" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: toggle-master-secrets, key: AUTH_DB_URL } } }
            - { name: MASTER_KEY, valueFrom: { secretKeyRef: { name: toggle-master-secrets, key: MASTER_KEY } } }
          readinessProbe: { httpGet: { path: /health, port: 8001 } }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service }
spec:
  selector: { app: auth-service }
  ports: [{ port: 8001, targetPort: 8001 }]
